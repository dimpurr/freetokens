<div class="wrap">
  <nav class="back"><a href="__ROOT__index.html#h-channels">← freetokens · all channels</a></nav>

  <header class="mhead" id="chead"></header>

  <section aria-labelledby="h-now">
    <h2 id="h-now">What's free here now <small id="now-sub"></small></h2>
    <div class="chcards" id="now"></div>
  </section>

  <section aria-labelledby="h-chart">
    <h2 id="h-chart">Free periods <small>this channel's models side by side</small></h2>
    <div class="keyrow" id="key"></div>
    <div class="chart-scroll"><div class="chart" id="chart" role="img" aria-label="Chart of free periods on this channel"></div></div>
  </section>

  <section aria-labelledby="events">
    <h2 id="events">What happened <small>newest first, with sources</small></h2>
    <div class="tl" id="tl"></div>
  </section>

  <section aria-labelledby="h-details">
    <h2 id="h-details">Lane details</h2>
    <div class="details" id="details"></div>
  </section>

  <footer>Generated by <span class="mono">build.py</span> from <span class="mono">data/*.json</span>. Observed limits are one-off light readings from our own account, not load tests. <span id="stamp" class="mono"></span></footer>
</div>

<script>
/*__COMMON__*/

const C = D.channel;
const CL = lanesOn(C);
const isFree = (l) => l.status === "live" || l.status === "overdue";
document.title = `${C} · freetokens`;

/* header: facts derived from this channel's lanes */
(function () {
  const stat = (k, v, s) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span>${s ? `<span class="s">${s}</span>` : ""}</div>`;
  const last = CL.map((l) => l.checked.date).sort().pop();
  $("chead").innerHTML = `
    <span class="maker">${esc(lab("channel_type", CL[0].type))}</span>
    <h1>${esc(C)}</h1>
    <div class="stats">
      ${stat("Free now", `${CL.filter(isFree).length} / ${CL.length}`, "models free / tracked")}
      ${stat("Ended", String(CL.filter((l) => l.status === "ended").length), "tracked lanes that stopped")}
      ${stat("Last checked", `<span class="mono" style="font-size:0.95rem">${esc(last)}</span>`)}
    </div>`;
})();

/* what's free here now */
(function () {
  const order = { live: 0, overdue: 1, unavailable: 2, ended: 3 };
  const rows = [...CL].sort((a, b) => order[a.status] - order[b.status]);
  $("now-sub").textContent = `${rows.length} model${rows.length === 1 ? "" : "s"} tracked`;
  $("now").innerHTML = rows.map((l) => `
    <article class="chcard ${l.status}">
      <div class="name">${mlink(l.model)} ${statusChip(l.status)}</div>
      <div class="big">${esc(laneState(l))}</div>
      <div class="row">${isFree(l) && l.ends.confidence !== "none" ? confChip(l.ends.confidence) : ""} ${esc(l.ends.note || "")}</div>
      <div class="row">Checked <span class="mono">${esc(l.checked.date)}</span> · ${esc(lab("check_method", l.checked.method))}</div>
    </article>`).join("");
})();

renderChart($("chart"), CL, true);
$("key").innerHTML = chartKey;
$("tl").innerHTML = timelineHTML(eventsOn(C));

/* lane details */
$("details").innerHTML = CL.map((l) => {
  const ls = l.limits_stated, lo = l.limits_observed;
  const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  const id = l.model_id === "not recorded" ? `<span class="muted">not recorded</span>` : `<code>${esc(l.model_id)}</code><button type="button" class="copy" data-copy="${esc(l.model_id)}">Copy</button>`;
  const ends = [l.ends.announced && `announced ${fd(l.ends.announced)}`, l.ends.expected && `expected ${fd(l.ends.expected)}`].filter(Boolean).join(" · ") || "—";
  return `<div class="detail"><h3>${mlink(l.model)} ${statusChip(l.status)}</h3><dl>
    ${row("Model ID", id)}
    ${row("Free condition", esc(l.free_condition))}
    ${row("Limits (stated)", ls.source ? `<a href="${esc(ls.source)}" target="_blank" rel="noopener">${esc(ls.text)}</a>` : esc(ls.text))}
    ${row("Limits (observed)", lo ? `${esc(lo.text)} <span class="muted mono">${esc(lo.date)}</span>` : `<span class="muted">not measured</span>`)}
    ${row("Started", l.started.date ? `<span class="mono">${esc(fd(l.started.date))}</span>` : `<span class="muted">${esc(l.started.note)}</span>`)}
    ${row("Ends", `<span class="mono">${esc(ends)}</span> ${confChip(l.ends.confidence)}${l.ends.note ? ` <span class="muted">${esc(l.ends.note)}</span>` : ""}`)}
    ${row("Data policy", esc(lab("data_policy", l.data_policy)))}
    ${row("Checked", `<span class="mono">${esc(l.checked.date)}</span> · ${esc(lab("check_method", l.checked.method))}`)}
  </dl></div>`;
}).join("");

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-copy]"); if (!b) return;
  const done = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (e) { fallback(); }
});

$("stamp").innerHTML = ` · data as of ${esc(D.built)}`;
</script>
